<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashGuard — Secure Access Terminal</title>
  <meta name="description" content="Authenticate to access the FlashGuard quantum flash crash intelligence dashboard." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── TOKENS ────────────────────────────────────────────────── */
    :root {
      --void:       #020408;
      --abyss:      #050b12;
      --deep:       #080f1a;
      --panel:      #0a1628;
      --panel-2:    #0d1c35;
      --border:     rgba(0,210,255,0.08);
      --border-2:   rgba(0,210,255,0.16);
      --border-3:   rgba(0,210,255,0.28);
      --cyan:       #00d2ff;
      --cyan-dim:   rgba(0,210,255,0.12);
      --cyan-glow:  rgba(0,210,255,0.35);
      --cyan-pulse: rgba(0,210,255,0.05);
      --plasma:     #ff2d6b;
      --plasma-dim: rgba(255,45,107,0.12);
      --nova:       #7c3aed;
      --safe:       #00ff9d;
      --safe-dim:   rgba(0,255,157,0.08);
      --safe-glow:  rgba(0,255,157,0.3);
      --warn:       #ffc72c;
      --warn-dim:   rgba(255,199,44,0.1);
      --danger:     #ff3d2e;
      --danger-dim: rgba(255,61,46,0.1);
      --danger-glow:rgba(255,61,46,0.35);
      --text:       #e8f4ff;
      --text-2:     #7ba8cc;
      --text-3:     #3d6080;
      --text-4:     #1e3a52;
      --font-display:'Orbitron', monospace;
      --font-mono:  'Share Tech Mono', monospace;
      --font-body:  'Rajdhani', sans-serif;
      --ease-q:     cubic-bezier(0.08,0.82,0.17,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-body);
      background: var(--void); color: var(--text); overflow: hidden;
      cursor: none; min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: none; border: none; background: none; }
    input { font-family: inherit; }
    ::selection { background: rgba(0,210,255,0.18); }

    /* NOISE + SCANLINES */
    body::before {
      content:''; position:fixed; inset:0; z-index:1; pointer-events:none;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity:1; mix-blend-mode:overlay;
    }
    body::after {
      content:''; position:fixed; inset:0; z-index:1; pointer-events:none;
      background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,210,255,0.012) 3px,rgba(0,210,255,0.012) 4px);
    }

    /* CURSOR */
    #cur {
      position:fixed; pointer-events:none; z-index:9999;
      width:8px; height:8px; background:var(--cyan);
      clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
      transform:translate(-50%,-50%) rotate(45deg);
      box-shadow:0 0 10px var(--cyan-glow); transition:width .18s, height .18s;
    }
    #cur-ring {
      position:fixed; pointer-events:none; z-index:9998;
      width:36px; height:36px; border:1px solid rgba(0,210,255,0.4);
      clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
      transform:translate(-50%,-50%) rotate(45deg);
      transition:width .35s var(--ease-q), height .35s var(--ease-q), opacity .3s;
    }
    body:has(a:hover) #cur, body:has(button:hover) #cur, body:has(input:focus) #cur { width:14px; height:14px; }
    body:has(a:hover) #cur-ring, body:has(button:hover) #cur-ring, body:has(input:focus) #cur-ring { width:52px; height:52px; opacity:.4; }

    /* ── NEURAL GRID BACKGROUND ────────────────────────────── */
    .login-grid {
      position:fixed; inset:0; z-index:0;
      background-image:
        linear-gradient(var(--border) 1px,transparent 1px),
        linear-gradient(90deg,var(--border) 1px,transparent 1px);
      background-size:60px 60px;
      mask-image:radial-gradient(ellipse 80% 75% at 50% 50%,black 20%,transparent 100%);
      animation:grid-drift 20s linear infinite;
    }
    @keyframes grid-drift { from{background-position:0 0} to{background-position:60px 60px} }

    /* ── GLOW ORBS ─────────────────────────────────────────── */
    .glow-orb { position:fixed; z-index:0; border-radius:50%; filter:blur(100px); pointer-events:none; }
    .orb-1 {
      width:600px; height:600px; top:-200px; right:-100px;
      background:radial-gradient(circle,rgba(0,210,255,.1) 0%,transparent 70%);
      animation:orb-float 12s ease-in-out infinite;
    }
    .orb-2 {
      width:500px; height:500px; bottom:-150px; left:-100px;
      background:radial-gradient(circle,rgba(124,58,237,.08) 0%,transparent 70%);
      animation:orb-float 16s ease-in-out infinite reverse;
    }
    .orb-3 {
      width:300px; height:300px; top:50%; left:60%;
      background:radial-gradient(circle,rgba(255,45,107,.05) 0%,transparent 70%);
      animation:orb-float 10s ease-in-out infinite 3s;
    }
    @keyframes orb-float { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-30px) scale(1.05)} }

    /* ── PARTICLES CANVAS ──────────────────────────────────── */
    #particles {
      position:fixed; inset:0; z-index:0; pointer-events:none;
    }

    /* ── LOGIN CONTAINER ───────────────────────────────────── */
    .login-container {
      position:relative; z-index:10;
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:20px;
    }

    .login-card {
      width:100%; max-width:460px;
      background:rgba(10,22,40,0.85);
      backdrop-filter:blur(24px) saturate(1.3);
      border:1px solid var(--border-2);
      position:relative; overflow:hidden;
      animation:card-enter .8s var(--ease-q) both;
      box-shadow:
        0 40px 120px rgba(0,0,0,.7),
        0 0 80px rgba(0,210,255,.04),
        inset 0 1px 0 rgba(0,210,255,.1);
    }
    @keyframes card-enter { from{opacity:0;transform:translateY(30px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }

    /* Top glow line */
    .login-card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:2px;
      background:linear-gradient(90deg,transparent 5%,var(--cyan) 30%,var(--cyan) 70%,transparent 95%);
      box-shadow:0 0 20px var(--cyan-glow), 0 0 60px rgba(0,210,255,.15);
    }

    /* Animated scanning line */
    .login-card::after {
      content:''; position:absolute; left:0; right:0; height:1px;
      background:linear-gradient(90deg,transparent,var(--cyan-glow),transparent);
      animation:scan-line 4s ease-in-out infinite;
      opacity:0.5;
    }
    @keyframes scan-line { 0%{top:0;opacity:0} 10%{opacity:.5} 90%{opacity:.5} 100%{top:100%;opacity:0} }

    /* ── CARD HEADER ───────────────────────────────────────── */
    .card-header {
      padding:36px 40px 0;
      text-align:center;
    }
    .logo-container {
      display:flex; align-items:center; justify-content:center; gap:14px;
      margin-bottom:24px;
      animation:fup .6s .1s var(--ease-q) both;
    }
    .login-logo-mark {
      width:44px; height:44px; border:1.5px solid var(--cyan);
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 0 20px var(--cyan-glow),inset 0 0 12px var(--cyan-dim);
      clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
      animation:hpulse 4s ease-in-out infinite; overflow:hidden;
    }
    .login-logo-mark img { width:100%; height:100%; object-fit:cover; }
    @keyframes hpulse {
      0%,100%{box-shadow:0 0 16px var(--cyan-glow),inset 0 0 10px var(--cyan-dim)}
      50%{box-shadow:0 0 35px var(--cyan-glow),inset 0 0 20px var(--cyan-dim)}
    }
    .logo-text {
      font-family:var(--font-display); font-size:1rem; font-weight:700;
      letter-spacing:.12em; color:var(--text);
    }

    .card-title {
      font-family:var(--font-display); font-size:.72rem; font-weight:600;
      letter-spacing:.18em; text-transform:uppercase;
      color:var(--cyan); margin-bottom:6px;
      animation:fup .6s .2s var(--ease-q) both;
    }
    .card-subtitle {
      font-family:var(--font-mono); font-size:.68rem;
      letter-spacing:.08em; color:var(--text-3);
      animation:fup .6s .25s var(--ease-q) both;
    }

    /* ── SECURITY BADGE ────────────────────────────────────── */
    .security-badge {
      display:inline-flex; align-items:center; gap:8px;
      margin-top:18px; padding:6px 16px;
      border:1px solid rgba(0,255,157,.2);
      background:rgba(0,255,157,.04);
      font-family:var(--font-mono); font-size:.6rem;
      letter-spacing:.1em; text-transform:uppercase;
      color:var(--safe);
      animation:fup .6s .3s var(--ease-q) both;
    }
    .sec-dot {
      width:5px; height:5px; border-radius:50%;
      background:var(--safe);
      animation:sec-blink 2s infinite;
    }
    @keyframes sec-blink { 0%,100%{opacity:1;box-shadow:0 0 6px var(--safe-glow)} 50%{opacity:.3;box-shadow:none} }

    /* ── FORM ──────────────────────────────────────────────── */
    .card-body {
      padding:32px 40px 40px;
    }
    .form-group {
      margin-bottom:22px;
      animation:fup .7s calc(.35s + var(--delay,0s)) var(--ease-q) both;
    }
    .form-group:nth-child(1) { --delay:0s; }
    .form-group:nth-child(2) { --delay:.08s; }

    .form-label {
      display:flex; align-items:center; gap:8px;
      font-family:var(--font-mono); font-size:.65rem;
      letter-spacing:.14em; text-transform:uppercase;
      color:var(--text-3); margin-bottom:10px;
    }
    .label-icon {
      width:16px; height:16px; display:flex; align-items:center; justify-content:center;
      color:var(--cyan); font-size:.7rem;
    }

    .input-wrapper {
      position:relative;
    }
    .input-wrapper::before {
      content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
      background:var(--border-3);
      transition:background .3s, box-shadow .3s;
    }
    .input-wrapper:focus-within::before {
      background:var(--cyan);
      box-shadow:0 0 12px var(--cyan-glow);
    }

    .form-input {
      width:100%; padding:14px 16px 14px 18px;
      background:rgba(5,11,18,.9);
      border:1px solid var(--border-2);
      border-left:none;
      color:var(--text);
      font-family:var(--font-mono); font-size:.82rem;
      letter-spacing:.06em;
      transition:border-color .3s, background .3s, box-shadow .3s;
      outline:none;
    }
    .form-input::placeholder {
      color:var(--text-4); font-size:.72rem; letter-spacing:.1em;
    }
    .form-input:focus {
      border-color:var(--cyan);
      background:rgba(5,11,18,1);
      box-shadow:0 0 20px rgba(0,210,255,.06), inset 0 0 20px rgba(0,210,255,.03);
    }
    .form-input:focus + .input-glow { opacity:1; }

    .input-glow {
      position:absolute; bottom:-1px; left:0; right:0; height:1px;
      background:linear-gradient(90deg,transparent,var(--cyan),transparent);
      opacity:0; transition:opacity .3s;
    }

    /* Password toggle */
    .password-toggle {
      position:absolute; right:14px; top:50%; transform:translateY(-50%);
      color:var(--text-3); font-size:.7rem; padding:4px;
      font-family:var(--font-mono); letter-spacing:.06em;
      transition:color .2s; cursor:none;
    }
    .password-toggle:hover { color:var(--cyan); }

    /* ── REMEMBER / FORGOT ─────────────────────────────────── */
    .form-options {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:28px;
      animation:fup .7s .5s var(--ease-q) both;
    }
    .remember-check {
      display:flex; align-items:center; gap:8px;
      font-family:var(--font-mono); font-size:.62rem;
      letter-spacing:.1em; text-transform:uppercase;
      color:var(--text-3);
    }
    .custom-checkbox {
      width:16px; height:16px; position:relative;
      border:1px solid var(--border-3);
      background:rgba(5,11,18,.8);
      display:flex; align-items:center; justify-content:center;
      transition:border-color .2s, background .2s;
      cursor:none;
    }
    .custom-checkbox.checked {
      border-color:var(--cyan);
      background:var(--cyan-dim);
    }
    .custom-checkbox.checked::after {
      content:'✓'; font-size:.6rem; color:var(--cyan);
    }
    .forgot-link {
      font-family:var(--font-mono); font-size:.6rem;
      letter-spacing:.08em; color:var(--text-3);
      transition:color .2s;
    }
    .forgot-link:hover { color:var(--cyan); }

    /* ── LOGIN BUTTON ──────────────────────────────────────── */
    .login-btn {
      width:100%; padding:16px 0; position:relative; overflow:hidden;
      font-family:var(--font-display); font-size:.7rem; font-weight:700;
      letter-spacing:.14em; text-transform:uppercase;
      color:var(--void); background:var(--cyan);
      clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);
      box-shadow:0 0 30px var(--cyan-glow);
      transition:all .3s var(--ease-q);
      animation:fup .7s .56s var(--ease-q) both;
    }
    .login-btn::before {
      content:''; position:absolute; inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,.2) 0%,transparent 55%);
      opacity:0; transition:opacity .3s;
    }
    .login-btn:hover {
      transform:translateY(-2px);
      box-shadow:0 0 50px var(--cyan-glow), 0 8px 32px rgba(0,210,255,.2);
      background:#22daff;
    }
    .login-btn:hover::before { opacity:1; }
    .login-btn:active { transform:translateY(0); }

    /* Loading state */
    .login-btn.loading {
      color:transparent;
      pointer-events:none;
    }
    .login-btn.loading::after {
      content:''; position:absolute; top:50%; left:50%;
      width:18px; height:18px; margin:-9px 0 0 -9px;
      border:2px solid transparent; border-top-color:var(--void); border-right-color:var(--void);
      border-radius:50%; animation:btn-spin .6s linear infinite;
    }
    @keyframes btn-spin { to{transform:rotate(360deg)} }

    /* ── ERROR MESSAGE ─────────────────────────────────────── */
    .error-msg {
      display:none; align-items:center; gap:8px;
      padding:10px 14px; margin-bottom:18px;
      border:1px solid rgba(255,61,46,.25);
      background:rgba(255,61,46,.06);
      font-family:var(--font-mono); font-size:.65rem;
      letter-spacing:.06em; color:var(--danger);
      animation:shake .4s ease;
    }
    .error-msg.visible { display:flex; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }

    /* ── SUCCESS STATE ─────────────────────────────────────── */
    .success-overlay {
      position:absolute; inset:0; z-index:20;
      display:none; align-items:center; justify-content:center; flex-direction:column;
      background:rgba(10,22,40,.97); backdrop-filter:blur(20px);
    }
    .success-overlay.visible { display:flex; }
    .success-icon {
      width:64px; height:64px; border:2px solid var(--safe);
      clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
      display:flex; align-items:center; justify-content:center;
      font-size:1.6rem; color:var(--safe);
      box-shadow:0 0 30px var(--safe-glow);
      animation:success-pulse 1.5s ease-in-out infinite;
      margin-bottom:20px;
    }
    @keyframes success-pulse {
      0%,100%{box-shadow:0 0 20px var(--safe-glow)} 50%{box-shadow:0 0 50px var(--safe-glow)}
    }
    .success-text {
      font-family:var(--font-display); font-size:.7rem;
      letter-spacing:.16em; color:var(--safe); text-transform:uppercase;
      margin-bottom:8px;
    }
    .success-sub {
      font-family:var(--font-mono); font-size:.6rem;
      color:var(--text-3); letter-spacing:.1em;
    }

    /* ── DIVIDER ────────────────────────────────────────────── */
    .divider {
      display:flex; align-items:center; gap:14px;
      margin:24px 0;
      animation:fup .7s .62s var(--ease-q) both;
    }
    .divider-line {
      flex:1; height:1px;
      background:linear-gradient(90deg,transparent,var(--border-3),transparent);
    }
    .divider-text {
      font-family:var(--font-mono); font-size:.55rem;
      letter-spacing:.16em; text-transform:uppercase;
      color:var(--text-4);
    }

    /* ── BACK LINK ─────────────────────────────────────────── */
    .back-section {
      text-align:center;
      animation:fup .7s .68s var(--ease-q) both;
    }
    .back-link {
      display:inline-flex; align-items:center; gap:8px;
      font-family:var(--font-mono); font-size:.62rem;
      letter-spacing:.1em; text-transform:uppercase;
      color:var(--text-3); transition:color .2s;
    }
    .back-link:hover { color:var(--cyan); }
    .back-link span { transition:transform .2s; display:inline-block; }
    .back-link:hover span { transform:translateX(-3px); }

    /* ── FOOTER STATUS ─────────────────────────────────────── */
    .card-footer {
      padding:0 40px 28px;
      animation:fup .7s .74s var(--ease-q) both;
    }
    .status-bar {
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 14px;
      border-top:1px solid var(--border);
      background:rgba(5,11,18,.5);
    }
    .status-item {
      display:flex; align-items:center; gap:6px;
      font-family:var(--font-mono); font-size:.55rem;
      letter-spacing:.08em; text-transform:uppercase;
      color:var(--text-4);
    }
    .status-dot {
      width:4px; height:4px; border-radius:50%;
    }
    .status-dot.green { background:var(--safe); box-shadow:0 0 6px var(--safe-glow); }
    .status-dot.amber { background:var(--warn); box-shadow:0 0 6px var(--warn); }

    /* ── ANIMATIONS ────────────────────────────────────────── */
    @keyframes fup { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }

    /* ── RESPONSIVE ────────────────────────────────────────── */
    @media (max-width:560px) {
      .login-card { margin:10px; }
      .card-header { padding:28px 24px 0; }
      .card-body { padding:24px 24px 28px; }
      .card-footer { padding:0 24px 20px; }
      .form-options { flex-direction:column; gap:12px; align-items:flex-start; }
    }
  </style>
</head>
<body>

<!-- CURSOR -->
<div id="cur"></div>
<div id="cur-ring"></div>

<!-- BACKGROUND EFFECTS -->
<div class="login-grid"></div>
<div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>
<div class="glow-orb orb-3"></div>
<canvas id="particles"></canvas>

<!-- ═══════════ LOGIN CARD ═══════════ -->
<div class="login-container">
  <div class="login-card" id="loginCard">

    <!-- SUCCESS OVERLAY -->
    <div class="success-overlay" id="successOverlay">
      <div class="success-icon">✓</div>
      <div class="success-text">Access Granted</div>
      <div class="success-sub">REDIRECTING TO TERMINAL ...</div>
    </div>

    <!-- HEADER -->
    <div class="card-header">
      <div class="logo-container">
        <div class="login-logo-mark"><img src="Logo.png" alt="FlashGuard"></div>
        <span class="logo-text">FLASHGUARD</span>
      </div>
      <div class="card-title">Secure Access Terminal</div>
      <div class="card-subtitle">// AUTHENTICATION REQUIRED TO PROCEED</div>
      <div class="security-badge">
        <span class="sec-dot"></span>
        AES-256 ENCRYPTED SESSION
      </div>
    </div>

    <!-- FORM -->
    <div class="card-body">
      <form id="loginForm" autocomplete="off">

        <!-- Error Message -->
        <div class="error-msg" id="errorMsg">
          <span>⚠</span>
          <span id="errorText">Invalid credentials. Access denied.</span>
        </div>

        <!-- Username -->
        <div class="form-group">
          <label class="form-label" for="username">
            <span class="label-icon">⊡</span>
            OPERATOR ID
          </label>
          <div class="input-wrapper">
            <input
              type="text"
              class="form-input"
              id="username"
              name="username"
              placeholder="Enter your username"
              autocomplete="off"
              spellcheck="false"
              required
            />
            <div class="input-glow"></div>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="password">
            <span class="label-icon">⊠</span>
            ACCESS KEY
          </label>
          <div class="input-wrapper">
            <input
              type="password"
              class="form-input"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="off"
              required
              style="padding-right:60px;"
            />
            <div class="input-glow"></div>
            <button type="button" class="password-toggle" id="togglePassword">SHOW</button>
          </div>
        </div>

        <!-- Options -->
        <div class="form-options">
          <div class="remember-check">
            <div class="custom-checkbox" id="rememberCheckbox"></div>
            <span>REMEMBER SESSION</span>
          </div>
          <a href="#" class="forgot-link">RESET ACCESS KEY →</a>
        </div>

        <!-- Login Button -->
        <button type="submit" class="login-btn" id="loginBtn">
          ▶ AUTHENTICATE & CONNECT
        </button>

        <!-- Divider -->
        <div class="divider">
          <div class="divider-line"></div>
          <span class="divider-text">OR</span>
          <div class="divider-line"></div>
        </div>

        <!-- Back -->
        <div class="back-section">
          <a href="/" class="back-link">
            <span>←</span> RETURN TO MAIN TERMINAL
          </a>
        </div>
      </form>
    </div>

    <!-- Footer Status -->
    <div class="card-footer">
      <div class="status-bar">
        <div class="status-item">
          <span class="status-dot green"></span>
          SYSTEM ONLINE
        </div>
        <div class="status-item">
          <span class="status-dot green"></span>
          API CONNECTED
        </div>
        <div class="status-item" id="clockStatus">
          <span class="status-dot amber"></span>
          <span id="loginClock">00:00:00</span>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
/* ── CURSOR ──────────────────────────────────────────────── */
const cur = document.getElementById('cur');
const ring = document.getElementById('cur-ring');
let cx = 0, cy = 0, rx = 0, ry = 0;
document.addEventListener('mousemove', e => { cx = e.clientX; cy = e.clientY; });
(function anim() {
  cur.style.left = cx + 'px'; cur.style.top = cy + 'px';
  rx += (cx - rx) * .12; ry += (cy - ry) * .12;
  ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
  requestAnimationFrame(anim);
})();

/* ── PARTICLES ───────────────────────────────────────────── */
(function initParticles() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  class Particle {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.vx = (Math.random() - .5) * .3;
      this.vy = (Math.random() - .5) * .3;
      this.size = Math.random() * 1.5 + .5;
      this.alpha = Math.random() * .3 + .05;
      this.life = Math.random() * 200 + 100;
      this.age = 0;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.age++;
      if (this.age > this.life || this.x < -10 || this.x > W + 10 || this.y < -10 || this.y > H + 10)
        this.reset();
    }
    draw() {
      const a = this.alpha * (1 - this.age / this.life);
      ctx.fillStyle = `rgba(0,210,255,${a})`;
      ctx.fillRect(this.x, this.y, this.size, this.size);
    }
  }

  for (let i = 0; i < 80; i++) particles.push(new Particle());

  function loop() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => { p.update(); p.draw(); });

    // Draw connections
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          ctx.strokeStyle = `rgba(0,210,255,${.06 * (1 - dist / 120)})`;
          ctx.lineWidth = .5;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(loop);
  }
  loop();
})();

/* ── CLOCK ───────────────────────────────────────────────── */
(function initClock() {
  const el = document.getElementById('loginClock');
  setInterval(() => {
    const n = new Date(), p = v => String(v).padStart(2, '0');
    el.textContent = `${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
  }, 1000);
})();

/* ── PASSWORD TOGGLE ─────────────────────────────────────── */
document.getElementById('togglePassword').addEventListener('click', function () {
  const inp = document.getElementById('password');
  if (inp.type === 'password') {
    inp.type = 'text';
    this.textContent = 'HIDE';
  } else {
    inp.type = 'password';
    this.textContent = 'SHOW';
  }
});

/* ── REMEMBER CHECKBOX ───────────────────────────────────── */
let rememberChecked = false;
document.getElementById('rememberCheckbox').addEventListener('click', function () {
  rememberChecked = !rememberChecked;
  this.classList.toggle('checked', rememberChecked);
});

/* ── LOGIN FORM ──────────────────────────────────────────── */
document.getElementById('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  const errorText = document.getElementById('errorText');
  const loginBtn = document.getElementById('loginBtn');

  // Hide previous errors
  errorMsg.classList.remove('visible');

  // Validation
  if (!username || !password) {
    errorText.textContent = 'All fields are required. Enter credentials.';
    errorMsg.classList.add('visible');
    return;
  }

  // Show loading state
  loginBtn.classList.add('loading');

  // Simulate authentication delay for UX
  setTimeout(() => {
    // Simple client-side validation (replace with real API auth as needed)
    // Accept any non-empty username/password for now
    if (username.length >= 1 && password.length >= 1) {
      // Store session
      const storage = rememberChecked ? localStorage : sessionStorage;
      storage.setItem('fg_authenticated', 'true');
      storage.setItem('fg_username', username);
      storage.setItem('fg_login_time', new Date().toISOString());

      // Show success
      loginBtn.classList.remove('loading');
      document.getElementById('successOverlay').classList.add('visible');

      // Redirect to dashboard
      setTimeout(() => {
        window.location.href = '/dashboard.html';
      }, 1800);
    } else {
      loginBtn.classList.remove('loading');
      errorText.textContent = 'Invalid credentials. Access denied.';
      errorMsg.classList.add('visible');
    }
  }, 1200);
});

/* ── KEYBOARD SHORTCUTS ──────────────────────────────────── */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') window.location.href = '/';
});
</script>
</body>
</html>
